{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Registration</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS (editable) -->
    <link href="{% static 'css/reg.css' %}" rel="stylesheet">
</head>
<body>
    <section class="container">
        <div class="reg-container">
            <div class="circle circle-one"></div>
            <div class="form-container">
                <h1 class="opacity">REGISTRATION</h1>
                <form method="post">
                    {% csrf_token %}
                    <input type="text" placeholder="Name" pattern="[A-Za-z\s]+" name="name"  required/>
                    <input type="text" placeholder="Vehicle Number" pattern="^[A-Z]{2}[- ]?\d{2}[- ]?[A-Z]{1,2}[- ]?\d{4}$" name="vehicle_no" required/>
                    <input type="email" placeholder="Email" name="email" required/>
                    <input type="tel" placeholder="Mobile" name="mobile" pattern="^[6-9]\d{9}$" required minlength="10" maxlength="10"/>
                    <input type="password" placeholder="Password" name="password" required/>
                    <input type="password" placeholder="Re Enter Password" name="re_password" required/>
                    <button class="opacity">Register</button>
                    {% if messages %}
				{% for m in messages %}
				<p style="color:red; text-align:center;">
					{{m}}
				</p>
				{% endfor %}
				{% endif %}
                </form>
                <div class="register-forget opacity">
                    <a href="{% url 'user_log' %}">Login</a>
                    <a href="{% url 'home' %}">Home</a>
                </div>
            </div>
            <div class="circle circle-two"></div>
        </div>
        <div class="theme-btn-container"></div>
    </section>
<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
