{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Give Fine</title>
    <link rel="stylesheet" href="{% static 'css/gf.css' %}">
</head>
<body>
<div class="container">
    <button onclick="window.location.href='{% url 'admin_dashboard' %}';">Dashboard</button>
    <h2>Issue Fine</h2>
    <form method="POST" action="">
        {% csrf_token %}
        {% if selected_image %}
        <div class="fine-image">
            <img src="{{ MEDIA_URL }}{{ selected_image }}" alt="Violation Image" width="300px">
        </div>
        <input type="hidden" name="image_path" value="{{ selected_image }}">
        {% endif %}
        <label for="vehicle_no">Vehicle Number:</label>
        <select name="vehicle_no" id="vehicle_no" required onchange="fetchUserData()">
            <option value="">Select Vehicle</option>
            {% for user in users %}
                <option value="{{ user.vehicle_no }}" data-name="{{ user.name }}" data-email="{{ user.email }}">
                    {{ user.vehicle_no }}
                </option>
            {% endfor %}
        </select>
        <label for="user_name">User Name:</label>
        <input type="text" id="user_name" name="user_name" readonly>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" readonly>
        <label for="fine_amount">Fine Amount:</label>
        <input type="number" id="fine_amount" name="fine_amount" min="500" required>
        <button type="submit">Send</button>
    </form>
    {% if messages %}
    {% for m in messages %}
    <p style="color:red; text-align:center;">
        {{m}}
    </p>
    {% endfor %}
    {% endif %}
</div>

<script>
    function fetchUserData() {
        var vehicleSelect = document.getElementById("vehicle_no");
        var selectedOption = vehicleSelect.options[vehicleSelect.selectedIndex];
        document.getElementById("user_name").value = selectedOption.getAttribute("data-name");
        document.getElementById("email").value = selectedOption.getAttribute("data-email");
    }
</script>
</body>
</html>
